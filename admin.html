<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoValues Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg" href="icon.svg">
    <script src="theme.js"></script>
    <script src="translations.js"></script>
    <style>
        .admin-login {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 60px;
        }
        .admin-login input {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            width: 280px;
            text-align: center;
            font-family: inherit;
        }
        .admin-login input::placeholder { color: var(--text-dim); }
        .admin-login input:focus { outline: none; border-color: var(--accent-primary); }

        .stats-bar {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin: 20px 0 30px;
            flex-wrap: wrap;
        }
        .stat-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px 25px;
            text-align: center;
        }
        .stat-number { font-size: 28px; font-weight: bold; color: var(--text-primary); }
        .stat-label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; margin-top: 4px; }

        .results-table {
            width: 100%;
            margin: 0 auto;
            border-collapse: collapse;
            font-size: 13px;
        }
        .results-table th {
            background: var(--card-bg);
            color: var(--text-dim);
            padding: 10px 8px;
            text-align: left;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
            z-index: 1;
            white-space: nowrap;
        }
        .results-table td {
            padding: 8px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
            max-width: 135px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .results-table tr:hover td { background: var(--hover-shadow); cursor: pointer; }
        .results-table .ideology-cell {
            font-weight: 700;
        }
        .result-tag {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        #admin-content { display: none; width: 100%; }
        .table-scroll {
            max-height: 70vh;
            overflow: auto;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            width: 100%;
        }
        .filter-bar {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-bar select, .filter-bar button {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
            width: auto;
            min-width: 150px;
        }
        .filter-bar select:focus { outline: none; border-color: var(--accent-primary); }

        /* --- Modal --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.82);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 36px;
            max-width: 880px;
            width: 92%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: var(--soft-shadow);
        }
        .modal-close {
            position: absolute;
            top: 15px; right: 20px;
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 26px;
            cursor: pointer;
            width: auto;
            padding: 4px 10px;
        }
        .modal-close:hover { color: var(--text-primary); }

        .modal-icons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 22px;
            margin: 25px 0;
        }
        .modal-icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: inherit;
            width: 112px;
        }
        .modal-icon-item img {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            margin-bottom: 8px;
        }
        .modal-icon-item p {
            font-size: 11px;
            text-align: center;
            text-transform: uppercase;
            color: var(--text-primary);
            line-height: 1.3;
            margin: 0;
            font-weight: 600;
        }

        .modal-ideology {
            text-align: center;
            margin: 20px 0 10px;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            display: inline-block;
        }
        .modal-next-closest {
            text-align: center;
            margin: 8px 0 20px;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 14px;
            border: 1px solid;
            display: inline-block;
        }
        .modal-center { text-align: center; }

        .modal-who {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }
        .who-row {
            display: flex;
            gap: 10px;
            margin: 6px 0;
            font-size: 13px;
        }
        .who-label {
            color: var(--text-dim);
            min-width: 80px;
            text-transform: uppercase;
            font-size: 11px;
            padding-top: 1px;
        }
        .who-value { color: var(--text-primary); }
        .who-device {
            background: var(--card-bg);
            padding: 4px 10px;
            border-radius: 5px;
            color: var(--text-primary);
            font-size: 13px;
            display: inline-block;
            margin-top: 2px;
        }
        .modal-time {
            color: var(--text-dim);
            font-size: 12px;
            text-align: center;
            margin-bottom: 10px;
        }
        .modal-admin-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 22px;
            flex-wrap: wrap;
        }
        .modal-admin-actions button {
            width: auto;
            min-width: 150px;
            padding: 9px 18px;
            font-size: 13px;
        }
        .btn-danger {
            border-color: #c0392b !important;
            color: #e74c3c !important;
        }
        .btn-danger:hover {
            background: rgba(231, 76, 60, 0.14) !important;
        }
        .compare-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        .compare-row {
            display: grid;
            grid-template-columns: 1fr 120px 1fr;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
        }
        .compare-row.same-axis {
            border-color: rgba(46, 204, 113, 0.45);
            background: rgba(46, 204, 113, 0.06);
        }
        .compare-side {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 600;
        }
        .compare-side.right {
            justify-content: flex-end;
            text-align: right;
        }
        .compare-side img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .compare-cat {
            text-align: center;
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-dim);
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .compare-badge-same {
            display: inline-block;
            margin-top: 3px;
            padding: 2px 7px;
            border-radius: 999px;
            font-size: 10px;
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
        }
    </style>
</head>
<body>
    <button class="theme-toggle-corner" onclick="toggleTheme()" aria-label="Toggle light/dark mode">
        <svg width="80" height="80" viewBox="0 0 250 250" aria-hidden="true">
            <path d="M0,0 L250,250 L250,0 Z"></path>
            <g class="icon-sun" transform="translate(142, 52) scale(2.2)">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
            </g>
            <g class="icon-moon" transform="translate(142, 52) scale(2.2)">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
            </g>
        </svg>
    </button>

    <div class="main-container" style="max-width: 1480px;">
        <div class="title-container">
            <h1>NeoValues</h1>
            <span class="version-text">admin · v4.4</span>
        </div>

        <!-- Login -->
        <div id="admin-login" class="admin-login">
            <p class="intro-text">Enter admin password</p>
            <input type="password" id="pw-input" placeholder="password" onkeydown="if(event.key==='Enter') doLogin()">
            <button onclick="doLogin()">Enter</button>
            <p id="login-error" style="color: #e74c3c; display: none;">wrong password</p>
        </div>

        <!-- Dashboard -->
        <div id="admin-content">
            <div class="stats-bar">
                <div class="stat-box">
                    <div class="stat-number" id="total-count">-</div>
                    <div class="stat-label">Total Submissions</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="today-count">-</div>
                    <div class="stat-label">Today</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="top-ideology">-</div>
                    <div class="stat-label">Most Common Match</div>
                </div>
            </div>

            <div class="filter-bar">
                <select id="filter-ideology" onchange="renderTable()">
                    <option value="">All Ideologies</option>
                </select>
                <select id="filter-econ" onchange="renderTable()">
                    <option value="">All Economics</option>
                </select>
                <select id="filter-authority" onchange="renderTable()">
                    <option value="">All Authority</option>
                </select>
                <button id="compare-btn" onclick="openCompareModal()" disabled style="opacity:0.5">Compare Selected (0/2)</button>
                <button onclick="exportCSV()">Export CSV</button>
            </div>

            <div class="table-scroll">
                <table class="results-table">
                    <thead>
                        <tr>
                            <th style="width:28px">Cmp</th>
                            <th>#</th>
                            <th>Name</th>
                            <th>Time</th>
                            <th>Economics</th>
                            <th>Resources</th>
                            <th>Culture</th>
                            <th>Authority</th>
                            <th>Nation</th>
                            <th>Foreign</th>
                            <th>Technology</th>
                            <th>Control</th>
                            <th>Territory</th>
                            <th>Ideology</th>
                            <th>Who?</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Result Detail Modal -->
    <div class="modal-overlay" id="detail-modal" onclick="if(event.target===this)closeModal()">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div class="title-container" style="margin-bottom:0">
                <h1 style="font-size:24px">NeoValues</h1>
                <span class="version-text">v4.4</span>
            </div>
            <div class="modal-time" id="modal-time"></div>
            <div class="modal-icons" id="modal-icons"></div>
            <div class="modal-center">
                <div class="modal-ideology" id="modal-ideology"></div>
            </div>
            <div class="modal-center">
                <div class="modal-next-closest" id="modal-next-closest"></div>
            </div>
            <div class="modal-admin-actions" id="modal-actions"></div>
            <div class="modal-who" id="modal-who"></div>
        </div>
    </div>

    <!-- Side-by-Side Comparison Modal -->
    <div class="modal-overlay" id="compare-modal" onclick="if(event.target===this)closeCompareModal()">
        <div class="modal-content" style="max-width: 920px;">
            <button class="modal-close" onclick="closeCompareModal()">&times;</button>
            <div class="title-container" style="margin-bottom: 12px;">
                <h1 style="font-size:24px">Side-by-Side Comparison</h1>
            </div>
            <div id="compare-header" style="display:grid;grid-template-columns:1fr 120px 1fr;gap:12px;text-align:center;align-items:center;margin-bottom:10px;"></div>
            <div class="compare-grid" id="compare-grid"></div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="share_card.js"></script>
    <script>
        let allData = [];
        let currentPw = '';
        let selectedIds = [];

        function getValDisplayName(val) {
            if (!val) return '-';
            const enVals = (typeof TRANSLATIONS !== 'undefined' && TRANSLATIONS.en && TRANSLATIONS.en.values) || {};
            return enVals[val] || val.replace(/_/g, ' ');
        }

        // --- Dynamically recompute ideology from current v4.2 data.js mappings ---
        // Gracefully supports both 9-category v4.2 submissions and legacy 6-category v1.4 submissions
        function computeIdeology(s) {
            const results = {
                economics: s.economics || null,
                resource_management: s.resource_management || null,
                culture: s.culture || null,
                authority: s.authority || null,
                nation: s.nation || null,
                foreign: s.foreign_policy || null,
                technology: s.technology || null,
                social_control: s.social_control || null,
                territorial_organization: s.territorial_organization || null
            };

            const isLegacyRow = !results.technology && !results.social_control && !results.territorial_organization;

            // 1. Exact Match
            const exactMatches = [];
            for (const [ideologyName, requirements] of Object.entries(ideologies)) {
                const allReqCats = Object.keys(requirements);
                const reqCats = isLegacyRow
                    ? allReqCats.filter(cat => results[cat] !== null)
                    : allReqCats;
                if (reqCats.length === 0) continue;

                const isFullMatch = reqCats.every(category => {
                    const allowed = Array.isArray(requirements[category])
                        ? requirements[category]
                        : [requirements[category]];
                    return allowed.includes(results[category]);
                });

                if (isFullMatch) {
                    const totalOptions = reqCats.reduce((sum, category) => {
                        const allowed = Array.isArray(requirements[category])
                            ? requirements[category]
                            : [requirements[category]];
                        return sum + allowed.length;
                    }, 0);
                    exactMatches.push({
                        name: ideologyName,
                        totalRequired: reqCats.length,
                        totalOptions
                    });
                }
            }

            exactMatches.sort((a, b) => (b.totalRequired - a.totalRequired) || (a.totalOptions - b.totalOptions));
            const finalLabel = exactMatches.length > 0 ? exactMatches[0].name : "No exact match";

            // 2. Next Closest Match
            const scoredLabels = Object.entries(ideologies).map(([name, requirements]) => {
                const allReqCats = Object.keys(requirements);
                const requiredCategories = isLegacyRow
                    ? allReqCats.filter(cat => results[cat] !== null)
                    : allReqCats;
                const totalRequired = requiredCategories.length;
                let score = 0;
                let penalty = 0;
                let identicalCount = 0;

                requiredCategories.forEach(category => {
                    const allowed = Array.isArray(requirements[category])
                        ? requirements[category]
                        : [requirements[category]];
                    const userVal = results[category];
                    if (!userVal) return;

                    if (allowed.includes(userVal)) {
                        score += 1.0;
                        identicalCount++;
                        return;
                    }

                    const userGroup = Object.keys(subCategories[category] || {}).find(group =>
                        subCategories[category][group].includes(userVal)
                    );
                    if (!userGroup) return;

                    const sharesSubCategory = allowed.some(val => {
                        const valGroup = Object.keys(subCategories[category] || {}).find(group =>
                            subCategories[category][group].includes(val)
                        );
                        return valGroup === userGroup;
                    });

                    if (sharesSubCategory) {
                        score += 0.35;
                    }

                    const allowedGroups = allowed.map(val =>
                        Object.keys(subCategories[category] || {}).find(group =>
                            subCategories[category][group].includes(val)
                        )
                    ).filter(Boolean);

                    const isAllIncompatible = allowedGroups.length > 0 && allowedGroups.every(reqGroup => {
                        const userIncompat = incompatibleSubCategories[userGroup] || [];
                        const reqIncompat = incompatibleSubCategories[reqGroup] || [];
                        return userIncompat.includes(reqGroup) || reqIncompat.includes(userGroup);
                    });

                    if (isAllIncompatible) {
                        penalty = -100;
                    }
                });

                const matchPercentage = totalRequired > 0 && penalty === 0
                    ? (score / totalRequired) * 100
                    : -100;

                return {
                    label: name,
                    score: score + penalty,
                    matchPercentage: Math.round(matchPercentage),
                    identicalCount,
                    totalRequired
                };
            })
            .filter(item => item.label !== finalLabel && item.score > 0)
            .sort((a, b) => {
                if (b.matchPercentage !== a.matchPercentage) return b.matchPercentage - a.matchPercentage;
                if (b.identicalCount !== a.identicalCount) return b.identicalCount - a.identicalCount;
                return b.totalRequired - a.totalRequired;
            });

            return {
                ideology: finalLabel,
                nextClosest: (scoredLabels.length > 0 && scoredLabels[0].matchPercentage > 0)
                    ? scoredLabels[0].label
                    : null
            };
        }

        function enrichData() {
            allData.forEach(s => {
                const computed = computeIdeology(s);
                s._ideology = computed.ideology;
                s._nextClosest = computed.nextClosest;
            });
        }

        async function doLogin() {
            const pw = document.getElementById('pw-input').value;
            try {
                const res = await fetch(`/api/admin/results?pw=${encodeURIComponent(pw)}`);
                if (!res.ok) {
                    document.getElementById('login-error').style.display = 'block';
                    return;
                }
                currentPw = pw;
                const data = await res.json();
                allData = data.submissions;
                enrichData();
                document.getElementById('admin-login').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                populateStats(data);
                populateFilters();
                renderTable();
            } catch (e) {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        function populateStats(data) {
            document.getElementById('total-count').textContent = data.count;

            const today = new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
            const todayCount = allData.filter(s => {
                if (!s.timestamp) return false;
                const d = new Date(s.timestamp + 'Z');
                return d.toLocaleDateString('en-CA', { timeZone: 'America/New_York' }) === today;
            }).length;
            document.getElementById('today-count').textContent = todayCount;

            const ideologyCounts = {};
            allData.forEach(s => {
                if (s._ideology && s._ideology !== 'No exact match') {
                    ideologyCounts[s._ideology] = (ideologyCounts[s._ideology] || 0) + 1;
                }
            });
            const topIdeology = Object.entries(ideologyCounts).sort((a, b) => b[1] - a[1])[0];
            document.getElementById('top-ideology').textContent = topIdeology ? topIdeology[0] : 'N/A';
        }

        function populateFilters() {
            const matchedIdeologies = [...new Set(allData.map(s => s._ideology).filter(Boolean))].sort();
            const econs = [...new Set(allData.map(s => s.economics).filter(Boolean))].sort();
            const auths = [...new Set(allData.map(s => s.authority).filter(Boolean))].sort();

            fillSelect('filter-ideology', matchedIdeologies, false);
            fillSelect('filter-econ', econs, true);
            fillSelect('filter-authority', auths, true);
        }

        function fillSelect(id, values, isValueId) {
            const sel = document.getElementById(id);
            const firstOpt = sel.options[0].text;
            sel.innerHTML = `<option value="">${firstOpt}</option>`;
            values.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v;
                opt.textContent = isValueId ? getValDisplayName(v) : v;
                sel.appendChild(opt);
            });
        }

        function parseUA(ua) {
            if (!ua) return { browser: 'Unknown', os: 'Unknown', device: 'Unknown' };

            let browser = 'Unknown';
            if (ua.includes('SamsungBrowser/')) browser = 'Samsung Browser';
            else if (ua.includes('Edg/')) browser = 'Edge';
            else if (ua.includes('OPR/') || ua.includes('Opera')) browser = 'Opera';
            else if (ua.includes('Chrome/') && !ua.includes('Edg/')) browser = 'Chrome';
            else if (ua.includes('Firefox/')) browser = 'Firefox';
            else if (ua.includes('Safari/') && !ua.includes('Chrome')) browser = 'Safari';

            let os = 'Unknown';
            if (ua.includes('Windows')) os = 'Windows';
            else if (ua.includes('Mac OS X') || ua.includes('Macintosh')) os = 'macOS';
            else if (ua.includes('Android')) os = 'Android';
            else if (ua.includes('iPhone') || ua.includes('iPad')) os = 'iOS';
            else if (ua.includes('Linux')) os = 'Linux';
            else if (ua.includes('CrOS')) os = 'ChromeOS';

            let device = 'Desktop';
            if (ua.includes('iPhone')) device = 'iPhone';
            else if (ua.includes('iPad')) device = 'iPad';
            else if (ua.includes('Android') && ua.includes('Mobile')) device = 'Android Phone';
            else if (ua.includes('Android')) device = 'Android Tablet';

            return { browser, os, device };
        }

        function shortWho(s) {
            const info = parseUA(s.user_agent);
            return `${info.device} · ${info.browser}`;
        }

        function renderTable() {
            const fIdeology = document.getElementById('filter-ideology').value;
            const fEcon = document.getElementById('filter-econ').value;
            const fAuth = document.getElementById('filter-authority').value;

            let filtered = allData;
            if (fIdeology) filtered = filtered.filter(s => s._ideology === fIdeology);
            if (fEcon) filtered = filtered.filter(s => s.economics === fEcon);
            if (fAuth) filtered = filtered.filter(s => s.authority === fAuth);

            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            filtered.forEach((s) => {
                const tr = document.createElement('tr');
                tr.onclick = () => openModal(s);
                const checked = selectedIds.includes(s.id) ? 'checked' : '';
                tr.innerHTML = `
                    <td onclick="event.stopPropagation()"><input type="checkbox" ${checked} onchange="toggleCompareSelect(${s.id}, this.checked)"></td>
                    <td>${s.id}</td>
                    <td style="color:#d4a574;font-weight:bold">${s.name ? escapeHtml(s.name) : '<span style="opacity:0.45">—</span>'}</td>
                    <td>${toEST(s.timestamp)}</td>
                    <td><span class="result-tag">${escapeHtml(getValDisplayName(s.economics))}</span></td>
                    <td><span class="result-tag">${escapeHtml(getValDisplayName(s.resource_management))}</span></td>
                    <td><span class="result-tag">${escapeHtml(getValDisplayName(s.culture))}</span></td>
                    <td><span class="result-tag">${escapeHtml(getValDisplayName(s.authority))}</span></td>
                    <td><span class="result-tag">${escapeHtml(getValDisplayName(s.nation))}</span></td>
                    <td><span class="result-tag">${escapeHtml(getValDisplayName(s.foreign_policy))}</span></td>
                    <td><span class="result-tag">${escapeHtml(getValDisplayName(s.technology))}</span></td>
                    <td><span class="result-tag">${escapeHtml(getValDisplayName(s.social_control))}</span></td>
                    <td><span class="result-tag">${escapeHtml(getValDisplayName(s.territorial_organization))}</span></td>
                    <td class="ideology-cell">${escapeHtml(s._ideology || '-')}</td>
                    <td style="opacity:0.7;font-size:12px">${escapeHtml(shortWho(s))}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function toEST(ts) {
            if (!ts) return '-';
            const d = new Date(ts + 'Z');
            return d.toLocaleString('en-US', {
                timeZone: 'America/New_York',
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', second: '2-digit',
                hour12: false
            });
        }

        function openModal(s) {
            const modal = document.getElementById('detail-modal');
            const iconsDiv = document.getElementById('modal-icons');
            const ideologyDiv = document.getElementById('modal-ideology');
            const nextDiv = document.getElementById('modal-next-closest');
            const whoDiv = document.getElementById('modal-who');
            const timeDiv = document.getElementById('modal-time');

            timeDiv.textContent = toEST(s.timestamp);
            iconsDiv.innerHTML = '';

            const resultMap = {
                economics: s.economics,
                resource_management: s.resource_management,
                culture: s.culture,
                authority: s.authority,
                nation: s.nation,
                foreign: s.foreign_policy,
                technology: s.technology,
                social_control: s.social_control,
                territorial_organization: s.territorial_organization
            };

            categories.forEach(cat => {
                const val = resultMap[cat];
                if (!val) return;

                const item = document.createElement('a');
                item.className = 'modal-icon-item';
                item.href = `description.html?id=${encodeURIComponent(val)}&cat=${encodeURIComponent(cat)}`;
                item.target = '_blank';

                const img = document.createElement('img');
                img.src = `icons/${cat}/${val}.svg`;
                img.onerror = () => { img.style.display = 'none'; };

                const name = document.createElement('p');
                name.textContent = getValDisplayName(val);

                item.appendChild(img);
                item.appendChild(name);
                iconsDiv.appendChild(item);
            });

            const ideology = s._ideology || 'No exact match';
            ideologyDiv.textContent = ideology;
            ideologyDiv.style.backgroundColor = (typeof labelColors !== 'undefined' && labelColors[ideology]) || '#7a7a7a';
            ideologyDiv.style.color = '#fff';

            if (s._nextClosest) {
                nextDiv.textContent = `Next closest: ${s._nextClosest}`;
                nextDiv.style.borderColor = (typeof labelColors !== 'undefined' && labelColors[s._nextClosest]) || '#7a7a7a';
                nextDiv.style.color = (typeof labelColors !== 'undefined' && labelColors[s._nextClosest]) || '#7a7a7a';
                nextDiv.style.display = 'inline-block';
            } else {
                nextDiv.style.display = 'none';
            }

            const actionsDiv = document.getElementById('modal-actions');
            const permalink = (typeof NVShare !== 'undefined') ? NVShare.buildShareUrl(resultMap, 'results.html') : 'results.html';
            if (actionsDiv) {
                actionsDiv.innerHTML = `
                    <button type="button" onclick="window.open('${escapeHtml(permalink)}', '_blank')">Open Permalink</button>
                    <button type="button" class="btn-danger" onclick="deleteSubmission(${s.id})">Delete Submission</button>
                `;
            }

            const info = parseUA(s.user_agent);
            whoDiv.innerHTML = `
                <div style="opacity:0.6;font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px">Who could this be?</div>
                ${s.name ? `<div class="who-row">
                    <span class="who-label">Name</span>
                    <span class="who-value" style="color:#d4a574;font-weight:bold;font-size:16px">${escapeHtml(s.name)}</span>
                </div>` : ''}
                <div class="who-row">
                    <span class="who-label">Device</span>
                    <span class="who-device">${escapeHtml(info.device)}</span>
                </div>
                <div class="who-row">
                    <span class="who-label">Browser</span>
                    <span class="who-value">${escapeHtml(info.browser)} on ${escapeHtml(info.os)}</span>
                </div>
                <div class="who-row">
                    <span class="who-label">IP</span>
                    <span class="who-value" style="font-family:monospace">${escapeHtml(s.ip || 'unknown')}</span>
                </div>
                <div class="who-row">
                    <span class="who-label">Full UA</span>
                    <span class="who-value" style="font-size:11px;opacity:0.6;word-break:break-all;white-space:normal">${escapeHtml(s.user_agent || 'unknown')}</span>
                </div>
            `;

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.remove('active');
            document.body.style.overflow = '';
        }

        function toggleCompareSelect(id, isChecked) {
            if (isChecked) {
                if (!selectedIds.includes(id)) {
                    if (selectedIds.length >= 2) selectedIds.shift();
                    selectedIds.push(id);
                }
            } else {
                selectedIds = selectedIds.filter(x => x !== id);
            }
            updateCompareBtn();
            renderTable();
        }

        function updateCompareBtn() {
            const btn = document.getElementById('compare-btn');
            if (!btn) return;
            btn.textContent = `Compare Selected (${selectedIds.length}/2)`;
            btn.disabled = selectedIds.length !== 2;
            btn.style.opacity = selectedIds.length === 2 ? '1' : '0.5';
        }

        function openCompareModal() {
            if (selectedIds.length !== 2) return;
            const a = allData.find(x => x.id === selectedIds[0]);
            const b = allData.find(x => x.id === selectedIds[1]);
            if (!a || !b) return;

            const header = document.getElementById('compare-header');
            const grid = document.getElementById('compare-grid');
            const colA = (typeof labelColors !== 'undefined' && labelColors[a._ideology]) || '#7a7a7a';
            const colB = (typeof labelColors !== 'undefined' && labelColors[b._ideology]) || '#7a7a7a';

            const mapRow = (s) => ({
                economics: s.economics,
                resource_management: s.resource_management,
                culture: s.culture,
                authority: s.authority,
                nation: s.nation,
                foreign: s.foreign_policy,
                technology: s.technology,
                social_control: s.social_control,
                territorial_organization: s.territorial_organization
            });
            const rA = mapRow(a);
            const rB = mapRow(b);

            let sameCount = 0;
            categories.forEach(c => { if (rA[c] && rA[c] === rB[c]) sameCount++; });

            header.innerHTML = `
                <div>
                    <div style="color:#d4a574;font-weight:700;font-size:17px">${escapeHtml(a.name || `#${a.id}`)}</div>
                    <div style="display:inline-block;margin-top:6px;padding:5px 14px;border-radius:999px;font-size:13px;font-weight:700;color:#fff;background:${colA}">${escapeHtml(a._ideology || 'No exact match')}</div>
                </div>
                <div style="font-size:12px;color:var(--text-dim);font-weight:700">${sameCount}/${categories.length} SHARED</div>
                <div>
                    <div style="color:#d4a574;font-weight:700;font-size:17px">${escapeHtml(b.name || `#${b.id}`)}</div>
                    <div style="display:inline-block;margin-top:6px;padding:5px 14px;border-radius:999px;font-size:13px;font-weight:700;color:#fff;background:${colB}">${escapeHtml(b._ideology || 'No exact match')}</div>
                </div>
            `;

            grid.innerHTML = '';
            categories.forEach(cat => {
                const vA = rA[cat];
                const vB = rB[cat];
                const isSame = Boolean(vA && vA === vB);
                const row = document.createElement('div');
                row.className = 'compare-row' + (isSame ? ' same-axis' : '');
                row.innerHTML = `
                    <div class="compare-side">
                        ${vA ? `<img src="icons/${cat}/${vA}.svg" onerror="this.style.display='none'">` : ''}
                        <span>${escapeHtml(getValDisplayName(vA))}</span>
                    </div>
                    <div class="compare-cat">
                        <div>${escapeHtml((categoryTitles && categoryTitles[cat]) || cat)}</div>
                        ${isSame ? '<span class="compare-badge-same">Match</span>' : ''}
                    </div>
                    <div class="compare-side right">
                        <span>${escapeHtml(getValDisplayName(vB))}</span>
                        ${vB ? `<img src="icons/${cat}/${vB}.svg" onerror="this.style.display='none'">` : ''}
                    </div>
                `;
                grid.appendChild(row);
            });

            document.getElementById('compare-modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeCompareModal() {
            document.getElementById('compare-modal').classList.remove('active');
            document.body.style.overflow = '';
        }

        async function deleteSubmission(id) {
            if (!confirm(`Delete submission #${id} permanently?`)) return;
            try {
                const res = await fetch(`/api/admin/results/${id}?pw=${encodeURIComponent(currentPw)}`, { method: 'DELETE' });
                if (!res.ok) return;
                allData = allData.filter(x => x.id !== id);
                selectedIds = selectedIds.filter(x => x !== id);
                closeModal();
                populateStats({ count: allData.length });
                populateFilters();
                updateCompareBtn();
                renderTable();
            } catch (e) {}
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                closeModal();
                closeCompareModal();
            }
        });

        function exportCSV() {
            const headers = [
                'id', 'name', 'timestamp',
                'economics', 'resource_management', 'culture', 'authority', 'nation', 'foreign_policy',
                'technology', 'social_control', 'territorial_organization',
                '_ideology', '_nextClosest', 'ip', 'user_agent'
            ];
            const headerNames = [
                'id', 'name', 'timestamp',
                'economics', 'resource_management', 'culture', 'authority', 'nation', 'foreign_policy',
                'technology', 'social_control', 'territorial_organization',
                'matched_ideology', 'next_closest', 'ip', 'user_agent'
            ];
            const rows = allData.map(s => headers.map(h => `"${(s[h] || '').toString().replace(/"/g, '""')}"`).join(','));
            const csv = [headerNames.join(','), ...rows].join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `neovalues_results_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }
    </script>
</body>
</html>
