<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoValues Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg" href="icon.svg">
    <style>
        .admin-login {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 60px;
        }
        .admin-login input {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #e0e0e0;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            width: 280px;
            text-align: center;
        }
        .admin-login input::placeholder { color: #666; }
        .admin-login input:focus { outline: none; border-color: #888; }

        .stats-bar {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin: 20px 0 30px;
            flex-wrap: wrap;
        }
        .stat-box {
            background: #2a2a2a;
            border-radius: 10px;
            padding: 15px 25px;
            text-align: center;
        }
        .stat-number { font-size: 28px; font-weight: bold; color: #fff; }
        .stat-label { font-size: 12px; color: #888; text-transform: uppercase; margin-top: 4px; }

        .results-table {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            border-collapse: collapse;
            font-size: 13px;
        }
        .results-table th {
            background: #2a2a2a;
            color: #aaa;
            padding: 10px 8px;
            text-align: left;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        .results-table td {
            padding: 8px;
            border-bottom: 1px solid #222;
            color: #ccc;
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .results-table tr:hover td { background: #1e1e1e; cursor: pointer; }
        .results-table .ideology-cell {
            color: #fff;
            font-weight: bold;
        }
        .result-tag {
            background: #333;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        #admin-content { display: none; }
        .table-scroll {
            max-height: 70vh;
            overflow-y: auto;
            border-radius: 10px;
            border: 1px solid #333;
        }
        .filter-bar {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-bar select, .filter-bar button {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #e0e0e0;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
        }
        .filter-bar select:focus { outline: none; border-color: #888; }

        /* --- Modal --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 40px;
            max-width: 800px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 15px; right: 20px;
            background: none;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
        }
        .modal-close:hover { color: #fff; }

        .modal-icons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            margin: 25px 0;
        }
        .modal-icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: inherit;
            width: 110px;
        }
        .modal-icon-item img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 8px;
        }
        .modal-icon-item p {
            font-size: 11px;
            text-align: center;
            text-transform: uppercase;
            color: #ccc;
            line-height: 1.3;
            margin: 0;
        }

        .modal-ideology {
            text-align: center;
            margin: 20px 0 10px;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            display: inline-block;
        }
        .modal-next-closest {
            text-align: center;
            margin: 8px 0 20px;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 14px;
            border: 1px solid;
            display: inline-block;
        }
        .modal-center { text-align: center; }

        .modal-who {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #333;
        }
        .who-row {
            display: flex;
            gap: 10px;
            margin: 6px 0;
            font-size: 13px;
        }
        .who-label {
            color: #666;
            min-width: 80px;
            text-transform: uppercase;
            font-size: 11px;
            padding-top: 1px;
        }
        .who-value { color: #aaa; }
        .who-device {
            background: #2a2a2a;
            padding: 4px 10px;
            border-radius: 5px;
            color: #ddd;
            font-size: 13px;
            display: inline-block;
            margin-top: 2px;
        }
        .modal-time {
            color: #555;
            font-size: 12px;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="main-container" style="max-width: 1300px;">
        <div class="title-container">
            <h1>NeoValues</h1>
            <span class="version-text">admin</span>
        </div>

        <!-- Login -->
        <div id="admin-login" class="admin-login">
            <p class="intro-text">Enter admin password</p>
            <input type="password" id="pw-input" placeholder="password" onkeydown="if(event.key==='Enter') doLogin()">
            <button onclick="doLogin()">Enter</button>
            <p id="login-error" style="color: #e74c3c; display: none;">wrong password</p>
        </div>

        <!-- Dashboard -->
        <div id="admin-content">
            <div class="stats-bar">
                <div class="stat-box">
                    <div class="stat-number" id="total-count">-</div>
                    <div class="stat-label">Total Submissions</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="today-count">-</div>
                    <div class="stat-label">Today</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="top-ideology">-</div>
                    <div class="stat-label">Most Common Match</div>
                </div>
            </div>

            <div class="filter-bar">
                <select id="filter-ideology" onchange="renderTable()">
                    <option value="">All Ideologies</option>
                </select>
                <select id="filter-econ" onchange="renderTable()">
                    <option value="">All Economics</option>
                </select>
                <select id="filter-authority" onchange="renderTable()">
                    <option value="">All Authority</option>
                </select>
                <button onclick="exportCSV()">Export CSV</button>
            </div>

            <div class="table-scroll">
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Time</th>
                            <th>Economics</th>
                            <th>Resources</th>
                            <th>Culture</th>
                            <th>Authority</th>
                            <th>Nation</th>
                            <th>Foreign</th>
                            <th>Ideology</th>
                            <th>Who?</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Result Detail Modal -->
    <div class="modal-overlay" id="detail-modal" onclick="if(event.target===this)closeModal()">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div class="title-container" style="margin-bottom:0">
                <h1 style="font-size:24px">NeoValues</h1>
                <span class="version-text">v1.4</span>
            </div>
            <div class="modal-time" id="modal-time"></div>
            <div class="modal-icons" id="modal-icons"></div>
            <div class="modal-center">
                <div class="modal-ideology" id="modal-ideology"></div>
            </div>
            <div class="modal-center">
                <div class="modal-next-closest" id="modal-next-closest"></div>
            </div>
            <div class="modal-who" id="modal-who"></div>
        </div>
    </div>

    <script src="data.js"></script>
    <script>
        let allData = [];
        let currentPw = '';

        // --- Dynamically recompute ideology from current data.js mappings ---
        // Mirrors the exact logic from results.html so labels always stay current
        function computeIdeology(s) {
            const results = {
                economics: s.economics,
                resource_management: s.resource_management,
                culture: s.culture,
                authority: s.authority,
                nation: s.nation,
                foreign: s.foreign_policy
            };
            const userResults = Object.values(results);

            // Exact match
            const matchedKey = Object.keys(labelMapping).find(key => {
                const requiredParts = key.split('|');
                return requiredParts.every(part => userResults.includes(part));
            });
            const finalLabel = matchedKey ? labelMapping[matchedKey] : "No exact match";

            // Scored next-closest
            const scoredLabels = Object.keys(labelMapping)
                .map(key => {
                    const requiredParts = key.split('|');
                    let score = 0;
                    let penalty = 0;

                    requiredParts.forEach(reqVal => {
                        const category = Object.keys(resultsMapping).find(cat => resultsMapping[cat][reqVal]);
                        const userVal = results[category];
                        if (!userVal) return;

                        const userGroup = Object.keys(subCategories[category] || {}).find(group =>
                            subCategories[category][group].includes(userVal)
                        );
                        const reqGroup = Object.keys(subCategories[category] || {}).find(group =>
                            subCategories[category][group].includes(reqVal)
                        );

                        if (userVal === reqVal) score += 1.0;
                        else if (userGroup && userGroup === reqGroup) score += 0.5;

                        if (userGroup && reqGroup && incompatibleSubCategories[userGroup]?.includes(reqGroup)) {
                            penalty = -100;
                        }
                    });

                    return { key, label: labelMapping[key], score: score + penalty };
                })
                .sort((a, b) => b.score - a.score)
                .filter(item => item.label !== finalLabel);

            const uniqueScoredLabels = [];
            const seenLabels = new Set();
            for (const item of scoredLabels) {
                if (!seenLabels.has(item.label)) {
                    seenLabels.add(item.label);
                    uniqueScoredLabels.push(item);
                }
            }

            return {
                ideology: finalLabel,
                nextClosest: uniqueScoredLabels.length > 0 ? uniqueScoredLabels[0].label : null
            };
        }

        // Enrich each submission with live-computed ideology
        function enrichData() {
            allData.forEach(s => {
                const computed = computeIdeology(s);
                s._ideology = computed.ideology;
                s._nextClosest = computed.nextClosest;
            });
        }

        async function doLogin() {
            const pw = document.getElementById('pw-input').value;
            try {
                const res = await fetch(`/api/admin/results?pw=${encodeURIComponent(pw)}`);
                if (!res.ok) {
                    document.getElementById('login-error').style.display = 'block';
                    return;
                }
                currentPw = pw;
                const data = await res.json();
                allData = data.submissions;
                enrichData();
                document.getElementById('admin-login').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                populateStats(data);
                populateFilters();
                renderTable();
            } catch (e) {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        function populateStats(data) {
            document.getElementById('total-count').textContent = data.count;

            const today = new Date().toISOString().split('T')[0];
            const todayCount = allData.filter(s => s.timestamp && s.timestamp.startsWith(today)).length;
            document.getElementById('today-count').textContent = todayCount;

            const ideologyCounts = {};
            allData.forEach(s => {
                if (s._ideology && s._ideology !== 'No exact match') {
                    ideologyCounts[s._ideology] = (ideologyCounts[s._ideology] || 0) + 1;
                }
            });
            const topIdeology = Object.entries(ideologyCounts).sort((a, b) => b[1] - a[1])[0];
            document.getElementById('top-ideology').textContent = topIdeology ? topIdeology[0] : 'N/A';
        }

        function populateFilters() {
            const ideologies = [...new Set(allData.map(s => s._ideology).filter(Boolean))].sort();
            const econs = [...new Set(allData.map(s => s.economics).filter(Boolean))].sort();
            const auths = [...new Set(allData.map(s => s.authority).filter(Boolean))].sort();

            fillSelect('filter-ideology', ideologies);
            fillSelect('filter-econ', econs);
            fillSelect('filter-authority', auths);
        }

        function fillSelect(id, values) {
            const sel = document.getElementById(id);
            const firstOpt = sel.options[0].text;
            sel.innerHTML = `<option value="">${firstOpt}</option>`;
            values.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v;
                opt.textContent = v.replace(/_/g, ' ');
                sel.appendChild(opt);
            });
        }

        function parseUA(ua) {
            if (!ua) return { browser: 'Unknown', os: 'Unknown', device: 'Unknown' };
            
            let browser = 'Unknown';
            if (ua.includes('SamsungBrowser/')) browser = 'Samsung Browser';
            else if (ua.includes('Edg/')) browser = 'Edge';
            else if (ua.includes('OPR/') || ua.includes('Opera')) browser = 'Opera';
            else if (ua.includes('Chrome/') && !ua.includes('Edg/')) browser = 'Chrome';
            else if (ua.includes('Firefox/')) browser = 'Firefox';
            else if (ua.includes('Safari/') && !ua.includes('Chrome')) browser = 'Safari';

            let os = 'Unknown';
            if (ua.includes('Windows')) os = 'Windows';
            else if (ua.includes('Mac OS X') || ua.includes('Macintosh')) os = 'macOS';
            else if (ua.includes('Android')) os = 'Android';
            else if (ua.includes('iPhone') || ua.includes('iPad')) os = 'iOS';
            else if (ua.includes('Linux')) os = 'Linux';
            else if (ua.includes('CrOS')) os = 'ChromeOS';

            let device = 'Desktop';
            if (ua.includes('iPhone')) device = 'iPhone';
            else if (ua.includes('iPad')) device = 'iPad';
            else if (ua.includes('Android') && ua.includes('Mobile')) device = 'Android Phone';
            else if (ua.includes('Android')) device = 'Android Tablet';

            return { browser, os, device };
        }

        function shortWho(s) {
            const info = parseUA(s.user_agent);
            return `${info.device} · ${info.browser}`;
        }

        function renderTable() {
            const fIdeology = document.getElementById('filter-ideology').value;
            const fEcon = document.getElementById('filter-econ').value;
            const fAuth = document.getElementById('filter-authority').value;

            let filtered = allData;
            if (fIdeology) filtered = filtered.filter(s => s._ideology === fIdeology);
            if (fEcon) filtered = filtered.filter(s => s.economics === fEcon);
            if (fAuth) filtered = filtered.filter(s => s.authority === fAuth);

            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            filtered.forEach((s) => {
                const tr = document.createElement('tr');
                tr.onclick = () => openModal(s);
                tr.innerHTML = `
                    <td>${s.id}</td>
                    <td>${s.timestamp || '-'}</td>
                    <td><span class="result-tag">${fmt(s.economics)}</span></td>
                    <td><span class="result-tag">${fmt(s.resource_management)}</span></td>
                    <td><span class="result-tag">${fmt(s.culture)}</span></td>
                    <td><span class="result-tag">${fmt(s.authority)}</span></td>
                    <td><span class="result-tag">${fmt(s.nation)}</span></td>
                    <td><span class="result-tag">${fmt(s.foreign_policy)}</span></td>
                    <td class="ideology-cell">${s._ideology || '-'}</td>
                    <td style="color:#777;font-size:12px">${shortWho(s)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function fmt(val) {
            return val ? val.replace(/_/g, ' ') : '-';
        }

        // --- Modal ---
        function openModal(s) {
            const modal = document.getElementById('detail-modal');
            const iconsDiv = document.getElementById('modal-icons');
            const ideologyDiv = document.getElementById('modal-ideology');
            const nextDiv = document.getElementById('modal-next-closest');
            const whoDiv = document.getElementById('modal-who');
            const timeDiv = document.getElementById('modal-time');

            timeDiv.textContent = s.timestamp || '';

            // Build icons like the real results page
            iconsDiv.innerHTML = '';
            const resultMap = {
                economics: s.economics,
                resource_management: s.resource_management,
                culture: s.culture,
                authority: s.authority,
                nation: s.nation,
                foreign: s.foreign_policy
            };

            categories.forEach(cat => {
                const val = resultMap[cat];
                if (!val) return;

                const item = document.createElement('div');
                item.className = 'modal-icon-item';

                const img = document.createElement('img');
                img.src = `icons/${cat}/${val}.svg`;
                img.onerror = () => { img.style.display = 'none'; };

                const name = document.createElement('p');
                const displayName = (resultsMapping[cat] && resultsMapping[cat][val]) 
                    ? resultsMapping[cat][val] 
                    : val;
                name.textContent = displayName.replace(/_/g, ' ');

                item.appendChild(img);
                item.appendChild(name);
                iconsDiv.appendChild(item);
            });

            // Use live-computed ideology
            const ideology = s._ideology || 'No exact match';
            ideologyDiv.textContent = ideology;
            ideologyDiv.style.backgroundColor = (typeof labelColors !== 'undefined' && labelColors[ideology]) || '#7a7a7a';
            ideologyDiv.style.color = '#fff';

            // Live-computed next closest
            if (s._nextClosest) {
                nextDiv.textContent = `Next closest: ${s._nextClosest}`;
                nextDiv.style.borderColor = (typeof labelColors !== 'undefined' && labelColors[s._nextClosest]) || '#7a7a7a';
                nextDiv.style.color = (typeof labelColors !== 'undefined' && labelColors[s._nextClosest]) || '#7a7a7a';
                nextDiv.style.display = 'inline-block';
            } else {
                nextDiv.style.display = 'none';
            }

            // Who section
            const info = parseUA(s.user_agent);
            whoDiv.innerHTML = `
                <div style="color:#555;font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px">Who could this be?</div>
                <div class="who-row">
                    <span class="who-label">Device</span>
                    <span class="who-device">${info.device}</span>
                </div>
                <div class="who-row">
                    <span class="who-label">Browser</span>
                    <span class="who-value">${info.browser} on ${info.os}</span>
                </div>
                <div class="who-row">
                    <span class="who-label">IP</span>
                    <span class="who-value" style="font-family:monospace">${s.ip || 'unknown'}</span>
                </div>
                <div class="who-row">
                    <span class="who-label">Full UA</span>
                    <span class="who-value" style="font-size:11px;color:#555;word-break:break-all;white-space:normal">${s.user_agent || 'unknown'}</span>
                </div>
            `;

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeModal();
        });

        function exportCSV() {
            const headers = ['id','timestamp','economics','resource_management','culture','authority','nation','foreign_policy','_ideology','_nextClosest','ip','user_agent'];
            const headerNames = ['id','timestamp','economics','resource_management','culture','authority','nation','foreign_policy','matched_ideology','next_closest','ip','user_agent'];
            const rows = allData.map(s => headers.map(h => `"${(s[h]||'').toString().replace(/"/g,'""')}"`).join(','));
            const csv = [headerNames.join(','), ...rows].join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `neovalues_results_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }
    </script>
</body>
</html>
